<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papa Bear 跨市場動能儀表板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .momentum-positive { color: #16a34a; font-weight: bold; } 
        .momentum-negative { color: #dc2626; font-weight: bold; } 
        .view-section { display: none; }
        .view-section.active { display: block; }
        .loading-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
        
        <header class="mb-8 border-b pb-4 flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
            <div>
                <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Papa Bear <span class="text-blue-600">動能策略監控</span></h1>
                <p class="text-gray-500 mt-2 text-sm">自適應多重週期系統 (ETF: 3/6/12月 | 股票: 1/3/6月 | 幣圈: 14天/1月/3月)</p>
            </div>
            
            <div class="flex flex-col items-end gap-2">
                <div class="text-sm text-gray-400 font-mono" id="last-updated">載入中...</div>
                <!-- 🚀 觸發更新按鈕 -->
                <button id="trigger-update-btn" onclick="triggerGithubAction()" class="flex items-center px-4 py-2 bg-black text-white text-sm rounded-full hover:bg-gray-800 transition shadow-sm group">
                    <svg id="update-icon" class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span>即時重新運算 (雲端更新)</span>
                </button>
            </div>
        </header>

        <!-- 導覽按鈕 -->
        <div class="flex space-x-4 mb-6">
            <button onclick="switchMainTab('dashboard')" id="btn-dashboard" class="px-4 py-2 bg-blue-600 text-white rounded shadow hover:bg-blue-700 transition">動能儀表板</button>
            <button onclick="switchMainTab('tickers')" id="btn-tickers" class="px-4 py-2 bg-white border text-gray-700 rounded shadow hover:bg-gray-50 transition flex items-center">
                驗證與匯出標的清單
            </button>
        </div>

        <!-- 儀表板主體內容 (保持原樣) -->
        <div id="view-dashboard" class="view-section active">
            <div class="flex flex-wrap border-b border-gray-200 mb-6 gap-2" id="tabs-nav">
                <button class="tab-btn active px-4 py-2 font-medium text-blue-600 border-b-2 border-blue-600 bg-blue-50" data-target="TW_STOCKS_0050">台灣股票</button>
                <button class="tab-btn px-4 py-2 font-medium text-gray-500 hover:bg-gray-100" data-target="TW_ETFS">台灣 ETF</button>
                <button class="tab-btn px-4 py-2 font-medium text-gray-500 hover:bg-gray-100" data-target="US_STOCKS_SP100">美國股票</button>
                <button class="tab-btn px-4 py-2 font-medium text-gray-500 hover:bg-gray-100" data-target="US_ETFS">美國 ETF</button>
                <button class="tab-btn px-4 py-2 font-medium text-gray-500 hover:bg-gray-100" data-target="CRYPTOCURRENCY">虛擬貨幣</button>
            </div>
            <div id="content-container" style="display: none;">
                <div id="history-area" class="bg-white shadow rounded-lg p-6 mb-8"></div>
                <div id="current-all-area" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4 mt-4"></div>
            </div>
        </div>

        <div id="view-tickers" class="view-section">
            <!-- 標的清單區域 -->
            <div id="tickers-list-area" class="bg-white shadow rounded-lg p-6"></div>
        </div>

        <!-- 頁尾提醒事項 -->
        <footer class="mt-12 pt-8 border-t border-gray-200 text-center">
            <div class="bg-yellow-50 border border-yellow-100 rounded-lg p-4 inline-block max-w-2xl">
                <p class="text-yellow-800 text-sm leading-relaxed">
                    <strong>⚠️ 系統自動維護提醒：</strong> 
                    由於 GitHub 平台限制，若此儲存庫超過 <span class="font-bold underline">60 天</span> 無任何操作（登入或更新），自動更新排程將會暫停。
                    建議每兩個月至少登入 GitHub 一次，或點擊上方「即時重新運算」按鈕以維持系統活力。
                </p>
            </div>
            <p class="text-gray-400 text-xs mt-4">© Papa Bear Momentum Strategy Tool</p>
        </footer>
    </div>

    <script>
        // 設定區：請將以下資訊替換為您的
        const GITHUB_USER = "ainsliemile"; // 您的 GitHub 帳號
        const GITHUB_REPO = "papa-bear-dashboard"; // 您的專案名稱
        const WORKFLOW_ID = "monthly_update.yml"; // 您的 YAML 檔名
        
        // ⚠️ 重要安全提醒：在靜態網頁放 Token 有洩漏風險。
        // 對於私人工具，您可以直接貼在下面，或在點擊時彈窗詢問。
        let GITHUB_TOKEN = ""; 

        async function triggerGithubAction() {
            if (!GITHUB_TOKEN) {
                GITHUB_TOKEN = prompt("為了安全驗證，請輸入您的 GitHub Personal Access Token (PAT):");
                if (!GITHUB_TOKEN) return;
            }

            const btn = document.getElementById('trigger-update-btn');
            const icon = document.getElementById('update-icon');
            btn.disabled = true;
            btn.classList.add('opacity-50');
            icon.classList.add('loading-spin');

            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/actions/workflows/${WORKFLOW_ID}/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json',
                    },
                    body: JSON.stringify({ ref: 'main' })
                });

                if (response.ok) {
                    alert("🚀 指令已發送至雲端！\n伺服器大約需要 2-3 分鐘重新計算，請稍後再刷新網頁。");
                } else {
                    const err = await response.json();
                    alert("❌ 更新失敗：" + (err.message || "請檢查 Token 是否正確"));
                    GITHUB_TOKEN = ""; // 清除錯誤的 Token
                }
            } catch (error) {
                alert("❌ 連線錯誤：" + error.message);
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
                icon.classList.remove('loading-spin');
            }
        }

        // --- 以下為原本的資料載入邏輯 (略) ---
        // (請保留您原本 index.html 的 fetchData, renderView, switchMainTab 等內容)
    </script>
</body>
</html>
