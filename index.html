<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Papa Bear 跨市場動能儀表板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .momentum-positive { color: #16a34a; font-weight: bold; } 
        .momentum-negative { color: #dc2626; font-weight: bold; } 
        .rank-badge {
            display: inline-block; width: 24px; height: 24px; line-height: 24px;
            text-align: center; border-radius: 50%; font-size: 0.75rem; font-weight: bold;
        }
        .rank-1 { background-color: #fef08a; color: #854d0e; }
        .rank-2 { background-color: #e5e7eb; color: #374151; }
        .rank-3 { background-color: #fed7aa; color: #9a3412; }
        .rank-4 { background-color: #d1fae5; color: #065f46; }
        .rank-5 { background-color: #dbeafe; color: #1e40af; }
        .rank-other { background-color: #f3f4f6; color: #6b7280; }
        .view-section { display: none; }
        .view-section.active { display: block; }
        td, th { white-space: nowrap; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
        <header class="mb-6 border-b pb-4 flex flex-col md:flex-row justify-between items-start md:items-end">
            <div>
                <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Papa Bear <span class="text-blue-600">動能策略監控</span></h1>
                <p class="text-gray-500 mt-2 text-sm">多重市場動能分析系統 (1/3/6月動能平均)</p>
            </div>
            <div class="text-sm text-gray-400 mt-4 md:mt-0 pb-1 font-mono" id="last-updated">載入中...</div>
        </header>

        <div id="spy-alert-banner" class="hidden bg-gradient-to-r from-red-600 to-red-700 text-white p-5 mb-4 rounded-lg shadow-lg border border-red-800 animate-pulse">
            <h2 class="text-lg font-bold flex items-center">🚨 SPY(1+3) 避險預警：美股進入修正區</h2>
        </div>
        <div id="tw-alert-banner" class="hidden bg-gradient-to-r from-orange-600 to-orange-700 text-white p-5 mb-6 rounded-lg shadow-lg border border-orange-800 animate-pulse">
            <h2 class="text-lg font-bold flex items-center">⚠️ 0050(1+3) 避險預警：台股進入修正區</h2>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded-r-md shadow-sm">
                <h3 class="text-md font-bold text-blue-800 mb-1">美股濾網：SPY(1+3)</h3>
                <p class="text-xs text-blue-900">當前 <span id="spy-momentum-value" class="font-bold">...</span></p>
            </div>
            <div class="bg-amber-50 border-l-4 border-amber-500 p-4 rounded-r-md shadow-sm">
                <h3 class="text-md font-bold text-amber-800 mb-1">台股濾網：0050(1+3)</h3>
                <p class="text-xs text-amber-900">當前 <span id="tw-momentum-value" class="font-bold">...</span></p>
            </div>
        </div>

        <div class="flex space-x-4 mb-6">
            <button onclick="switchMainTab('dashboard')" id="btn-dashboard" class="px-4 py-2 bg-blue-600 text-white rounded shadow transition">儀表板</button>
            <button onclick="switchMainTab('tickers')" id="btn-tickers" class="px-4 py-2 bg-white border text-gray-700 rounded shadow transition">標的清單</button>
        </div>

        <div id="loading" class="text-center py-10 text-gray-500">正在載入數據...</div>

        <div id="view-dashboard" class="view-section active">
            <div class="flex flex-wrap border-b border-gray-200 mb-6 gap-2" id="tabs-nav">
                <button class="tab-btn active px-4 py-2 font-medium text-blue-600 border-b-2 border-blue-600 bg-blue-50 transition-colors" data-target="ALL_ASSETS">🏆 綜合排名</button>
                <button class="tab-btn px-4 py-2 font-medium text-gray-500 hover:text-gray-700 transition-colors" data-target="TW_STOCKS_0050">台灣股票</button>
                <button class="tab-btn px-4 py-2 font-medium text-gray-500 hover:text-gray-700 transition-colors" data-target="TW_ETFS">台灣 ETF</button>
                <button class="tab-btn px-4 py-2 font-medium text-gray-500 hover:text-gray-700 transition-colors" data-target="US_STOCKS_SP100">美國股票</button>
                <button class="tab-btn px-4 py-2 font-medium text-gray-500 hover:text-gray-700 transition-colors" data-target="US_ETFS">美國 ETF</button>
                <button class="tab-btn px-4 py-2 font-medium text-gray-500 hover:text-gray-700 transition-colors" data-target="CRYPTOCURRENCY">虛擬貨幣</button>
            </div>

            <div id="content-container" style="display: none;">
                <div class="bg-white shadow rounded-lg p-6 mb-8">
                    <h2 class="text-lg font-bold text-gray-800 mb-4" id="history-title">歷史回測排名</h2>
                    <div id="history-area" class="overflow-x-auto"></div>
                </div>
                <div class="bg-white shadow rounded-lg p-6">
                    <h2 class="text-lg font-bold text-gray-800 mb-2" id="current-grid-title">當月完整動能排行</h2>
                    <div id="current-all-area" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4 mt-4"></div>
                </div>
            </div>
        </div>

        <script>
            let fullData = {};
            const getColorClass = (val) => val >= 0 ? 'momentum-positive' : 'momentum-negative';
            const formatVal = (val) => val !== 0 ? `${val.toFixed(2)}%` : '-';

            async function fetchData() {
                try {
                    const res = await fetch('./momentum_history.json?t=' + new Date().getTime());
                    fullData = await res.json();
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('content-container').style.display = 'block';
                    
                    // Filter Logic
                    if (fullData.spy_1_3_momentum !== undefined) {
                        const s = fullData.spy_1_3_momentum;
                        document.getElementById('spy-momentum-value').innerText = `${s.toFixed(2)}%`;
                        if(s < 0) document.getElementById('spy-alert-banner').classList.remove('hidden');
                    }
                    if (fullData.tw_0050_1_3_momentum !== undefined) {
                        const t = fullData.tw_0050_1_3_momentum;
                        document.getElementById('tw-momentum-value').innerText = `${t.toFixed(2)}%`;
                        if(t < 0) document.getElementById('tw-alert-banner').classList.remove('hidden');
                    }

                    renderView('TW_STOCKS_0050');
                } catch(e) { document.getElementById('loading').innerText = "載入失敗"; }
            }

            function renderView(categoryKey) {
                // 🚀 關鍵修改：ALL_ASSETS 排 10 名，其餘類別從 3 改為 5
                const maxRanks = categoryKey === 'ALL_ASSETS' ? 10 : 5;
                const months = Object.keys(fullData.history || {}).sort().reverse();
                
                let html = `<table class="min-w-full divide-y divide-gray-200"><thead><tr><th class="px-4 py-2">時間</th>`;
                for(let i=1; i<=maxRanks; i++) html += `<th class="px-4 py-2">No.${i}</th>`;
                html += `</tr></thead><tbody>`;

                months.forEach(month => {
                    const row = fullData.history[month][categoryKey] || [];
                    html += `<tr><td class="px-4 py-2 font-bold">${month}</td>`;
                    for(let i=0; i<maxRanks; i++) {
                        const item = row[i] || {symbol:'-',momentum:0};
                        const bClass = i<5 ? `rank-${i+1}` : 'rank-other';
                        html += `<td class="px-4 py-2"><span class="rank-badge ${bClass} mr-1">${i+1}</span>${item.symbol} (${formatVal(item.momentum)})</td>`;
                    }
                    html += `</tr>`;
                });
                document.getElementById('history-area').innerHTML = html + "</tbody></table>";

                const currentData = fullData.current_all[categoryKey] || [];
                let currentHtml = '';
                currentData.forEach((item, index) => {
                    const rank = index + 1;
                    const badge = rank<=5 ? `rank-${rank}` : 'rank-other';
                    currentHtml += `<div class="border rounded p-2 text-center text-xs"><span class="rank-badge ${badge} block mx-auto mb-1">${rank}</span><p class="font-bold">${item.symbol}</p><p class="${getColorClass(item.momentum)}">${formatVal(item.momentum)}</p></div>`;
                });
                document.getElementById('current-all-area').innerHTML = currentHtml;
            }

            document.querySelectorAll('.tab-btn').forEach(btn => btn.onclick = (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => b.className = b.className.replace(" active text-blue-600 border-b-2 border-blue-600 bg-blue-50", " text-gray-500"));
                e.target.className += " active text-blue-600 border-b-2 border-blue-600 bg-blue-50";
                renderView(e.target.getAttribute('data-target'));
            });

            fetchData();
        </script>
</body>
</html>
